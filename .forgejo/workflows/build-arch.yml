name: Build Arch Linux Package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-arch:
    name: Build Arch Package (.pkg.tar.zst)
    runs-on: [ubuntu-latest]
    container:
      image: archlinux:latest
    steps:
      - name: Update Pacman, Keyring & Toolchain
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja rust cargo clang \
            gtk4 libadwaita libshumate blueprint-compiler appstream wget unzip nodejs

      - name: Install Prebuilt TDLib & rlottie
        run: |
          # 1. Download prebuilt official TDLib 1.8.19
          wget -q https://github.com/melix99/tdjson-ci/releases/download/1.8.19/tdjson-x86_64.zip -O /tmp/tdjson.zip
          unzip -q /tmp/tdjson.zip -d /tmp/tdjson
          install -d /usr/lib/pkgconfig /usr/include /app/lib /app/include
          install -m755 /tmp/tdjson/libtdjson.so.* /usr/lib/
          ln -sf $(ls /usr/lib/libtdjson.so.* | head -n 1) /usr/lib/libtdjson.so
          ln -sf /usr/lib/libtdjson.so /app/lib/libtdjson.so
          sed -i 's|prefix=/app|prefix=/usr|g' /tmp/tdjson/pkgconfig/*.pc
          install -m644 /tmp/tdjson/pkgconfig/* /usr/lib/pkgconfig/

          # 2. Build and install rlottie (Samsung Lottie engine)
          git clone --depth 1 https://github.com/paper-plane-developers/rlottie.git /tmp/rlottie
          cd /tmp/rlottie
          meson setup build --prefix=/usr -Dexample=false -Dwerror=false
          ninja -C build install

      - name: Checkout Code
        run: |
          git config --global --add safe.directory '*'
          if [ -d ".git" ]; then
            git fetch --depth 1 origin ${{ github.sha }}
            git checkout --force FETCH_HEAD
          else
            git clone --depth 1 https://git.ricardtech.top/RicardTech/PaperPlane-Next.git .
            git checkout ${{ github.sha }} || true
          fi

      - name: Compile PaperPlane Next
        run: |
          meson setup build --prefix=/usr \
            -Dtg_api_id=22303002 \
            -Dtg_api_hash=3cc0969992690f032197e6609b296599
          meson compile -C build

      - name: Create Arch Package (.pkg.tar.zst)
        run: |
          mkdir -p /tmp/pkg-dest/usr/lib
          DESTDIR=/tmp/pkg-dest meson install -C build

          # Bundle prebuilt tdjson and rlottie shared libraries so package is 100% self-contained
          install -m755 /usr/lib/libtdjson.so.* /tmp/pkg-dest/usr/lib/
          ln -sf $(basename $(ls /tmp/pkg-dest/usr/lib/libtdjson.so.* | head -n 1)) /tmp/pkg-dest/usr/lib/libtdjson.so
          install -m755 /usr/lib/librlottie.so.* /tmp/pkg-dest/usr/lib/
          ln -sf $(basename $(ls /tmp/pkg-dest/usr/lib/librlottie.so.0.* | head -n 1)) /tmp/pkg-dest/usr/lib/librlottie.so.0
          ln -sf librlottie.so.0 /tmp/pkg-dest/usr/lib/librlottie.so
          strip --strip-unneeded /tmp/pkg-dest/usr/lib/*.so* || true

          # Extract version from meson.build
          PKGVER=$(grep -m1 "version:" meson.build | cut -d"'" -f2)

          cat <<EOF > /tmp/pkg-dest/.PKGINFO
          pkgname = paperplane-next
          pkgbase = paperplane-next
          pkgver = ${PKGVER}-1
          pkgdesc = Cliente Telegram nativo, moderno e ultra-leve para Linux em Rust + GTK4
          url = https://git.ricardtech.top/RicardTech/PaperPlane-Next
          builddate = $(date +%s)
          packager = RicardTech <https://repo.ricardtv.top>
          size = $(du -sb /tmp/pkg-dest | cut -f1)
          arch = x86_64
          license = GPL3
          depend = gtk4
          depend = libadwaita
          depend = libshumate
          EOF

          cd /tmp/pkg-dest
          tar --zstd -cf /tmp/paperplane-next-${PKGVER}-1-x86_64.pkg.tar.zst * .PKGINFO
          ls -lh /tmp/*.pkg.tar.zst
