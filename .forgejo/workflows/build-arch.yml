name: Build Arch Linux Package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-arch:
    name: Build Arch Package (.pkg.tar.zst)
    runs-on: [ubuntu-latest]
    container:
      image: archlinux:latest
    steps:
      - name: Update Pacman, Keyring & Toolchain
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel pacman-contrib git meson ninja rust cargo clang \
            gtk4 libadwaita libshumate blueprint-compiler appstream wget unzip nodejs curl

      - name: Install Prebuilt TDLib & rlottie
        run: |
          # 1. Download prebuilt official TDLib 1.8.19
          wget -q https://github.com/melix99/tdjson-ci/releases/download/1.8.19/tdjson-x86_64.zip -O /tmp/tdjson.zip
          unzip -q /tmp/tdjson.zip -d /tmp/tdjson
          install -d /usr/lib/pkgconfig /usr/include /app/lib /app/include
          install -m755 /tmp/tdjson/libtdjson.so.* /usr/lib/
          ln -sf $(ls /usr/lib/libtdjson.so.* | head -n 1) /usr/lib/libtdjson.so
          mkdir -p /app/lib && ln -sf /usr/lib/libtdjson.so /app/lib/
          sed -i 's|prefix=/app|prefix=/usr|g' /tmp/tdjson/pkgconfig/*.pc
          install -m644 /tmp/tdjson/pkgconfig/* /usr/lib/pkgconfig/

          # 2. Build and install rlottie (Samsung Lottie engine)
          git clone --depth 1 https://github.com/paper-plane-developers/rlottie.git /tmp/rlottie
          cd /tmp/rlottie
          meson setup build --prefix=/usr -Dexample=false -Dwerror=false
          ninja -C build install

      - name: Checkout Code
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch ${{ github.ref_name }} https://${{ github.token }}@git.ricardtech.top/RicardTech/PaperPlane-Next.git . || \
          git clone --depth 1 https://${{ github.token }}@git.ricardtech.top/RicardTech/PaperPlane-Next.git .

      - name: Compile PaperPlane Next
        run: |
          export CARGO_BUILD_JOBS=$(nproc)
          meson setup build --prefix=/usr \
            -Dtg_api_id=22303002 \
            -Dtg_api_hash=3cc0969992690f032197e6609b296599
          meson compile -C build -j $(nproc)

      - name: Create Arch Package (.pkg.tar.zst)
        run: |
          mkdir -p /tmp/pkg-dest/usr/lib
          DESTDIR=/tmp/pkg-dest meson install -C build --no-rebuild

          # Bundle prebuilt tdjson and rlottie shared libraries so package is 100% self-contained
          install -m755 /usr/lib/libtdjson.so.* /tmp/pkg-dest/usr/lib/
          ln -sf $(basename $(ls /tmp/pkg-dest/usr/lib/libtdjson.so.* | head -n 1)) /tmp/pkg-dest/usr/lib/libtdjson.so
          install -m755 /usr/lib/librlottie.so.* /tmp/pkg-dest/usr/lib/
          ln -sf $(basename $(ls /tmp/pkg-dest/usr/lib/librlottie.so.0.* | head -n 1)) /tmp/pkg-dest/usr/lib/librlottie.so.0
          ln -sf librlottie.so.0 /tmp/pkg-dest/usr/lib/librlottie.so
          strip --strip-unneeded /tmp/pkg-dest/usr/lib/*.so* || true

          # Extract version from meson.build
          PKGVER=$(grep -m1 "version:" meson.build | cut -d"'" -f2)

          cat <<EOF > /tmp/pkg-dest/.PKGINFO
          pkgname = paperplane-next
          pkgbase = paperplane-next
          pkgver = ${PKGVER}-1
          pkgdesc = Cliente Telegram nativo, moderno e ultra-leve para Linux em Rust + GTK4
          url = https://git.ricardtech.top/RicardTech/PaperPlane-Next
          builddate = $(date +%s)
          packager = RicardTech <https://repo.ricardtv.top>
          size = $(du -sb /tmp/pkg-dest | cut -f1)
          arch = x86_64
          license = GPL3
          depend = gtk4
          depend = libadwaita
          depend = libshumate
          EOF

          cd /tmp/pkg-dest
          tar -I 'zstd -T0 -1' -cf /tmp/paperplane-next-${PKGVER}-1-x86_64.pkg.tar.zst * .PKGINFO
          cp /tmp/paperplane-next-${PKGVER}-1-x86_64.pkg.tar.zst /github/home/ || cp /tmp/paperplane-next-${PKGVER}-1-x86_64.pkg.tar.zst ./ || true
          ls -lh /tmp/*.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v3
        with:
          name: paperplane-next-arch-package
          path: /tmp/*.pkg.tar.zst

      - name: Deploy to Arch Repository (RicardTech/repo)
        run: |
          PKG_FILE=$(ls /tmp/paperplane-next-*-x86_64.pkg.tar.zst | head -n 1)
          PKG_NAME=$(basename $PKG_FILE)
          PKGVER=$(grep -m1 "version:" meson.build | cut -d"'" -f2)

          # 1. Update Forgejo Release Assets
          curl -s -X POST \
            -H "Authorization: token 35ca768625442043458cc09c973ba1851d2cae55" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$PKG_FILE" \
            "https://git.ricardtech.top/api/v1/repos/RicardTech/PaperPlane-Next/releases/1743/assets?name=$PKG_NAME" || true

          # 2. Clone and update Arch Repository
          git config --global user.name "RicardTech CI"
          git config --global user.email "ci@ricardtech.top"
          git clone --depth 1 https://RicardTech:35ca768625442043458cc09c973ba1851d2cae55@git.ricardtech.top/RicardTech/repo.git /tmp/arch-repo
          cd /tmp/arch-repo/x86_64
          rm -f paperplane-next-*.pkg.tar.zst
          cp "$PKG_FILE" ./
          repo-add -R playmax.db.tar.gz "$PKG_NAME"
          rm -f playmax.db playmax.files
          cp playmax.db.tar.gz playmax.db
          cp playmax.files.tar.gz playmax.files
          git add -A
          git commit -m "feat(repo): publicar paperplane-next v${PKGVER}-1 no repositorio arch" || true
          git push origin main
